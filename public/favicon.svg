<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A0A0F" stroke="url(#grad)" stroke-width="2"/>
  <!-- Terminal prompt accent -->
  <path d="M14 20 L24 28 L14 36" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="28" y1="36" x2="38" y2="36" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <!-- PL Monogram -->
  <text x="38" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="url(#grad)" letter-spacing="-1">PL</text>
</svg>
